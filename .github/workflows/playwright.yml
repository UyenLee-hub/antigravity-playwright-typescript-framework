name: Playwright E2E Tests & Allure Report

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'allure-report'
  cancel-in-progress: false

jobs:
  test:
    name: Run Tests & Publish Allure Report
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Setup Java 21 (Required for Allure Report)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers & Dependencies
        run: npx playwright install --with-deps chromium

      - name: Create .env file
        run: |
          echo "BASE_URL=${{ vars.BASE_URL || secrets.BASE_URL }}" >> .env
          echo "ADMIN_EMAIL=${{ vars.ADMIN_EMAIL || vars.ADMIN_USERNAME || secrets.ADMIN_EMAIL || secrets.ADMIN_USERNAME }}" >> .env
          echo "ADMIN_USERNAME=${{ vars.ADMIN_USERNAME || vars.ADMIN_EMAIL || secrets.ADMIN_USERNAME || secrets.ADMIN_EMAIL }}" >> .env
          echo "ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD || vars.ADMIN_PASSWORD }}" >> .env
          echo "HEADLESS=true" >> .env
          echo "WORKERS=1" >> .env

      - name: Execute Playwright E2E Tests
        run: npm run test:chromium

      - name: Generate Allure Report
        if: always()
        run: |
          npm run allure:generate
          npm run allure:single || true

      - name: Generate GitHub Actions Job Summary
        if: always()
        run: |
          echo "## 📊 Playwright E2E Test Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Test Suite:** CRM Authentication & Security Test Suite (35 Test Cases)" >> $GITHUB_STEP_SUMMARY
          echo "- **Runner:** Playwright Test (@playwright/test)" >> $GITHUB_STEP_SUMMARY
          echo "- **Browser:** Chromium (Desktop 1920x1080)" >> $GITHUB_STEP_SUMMARY
          echo "- **Report Type:** Allure Report with Environment Metadata & Screenshots" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Artifacts Download" >> $GITHUB_STEP_SUMMARY
          echo "You can download the \`allure-report\` artifact below to view the interactive HTML report." >> $GITHUB_STEP_SUMMARY

      - name: Upload Allure Results Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          path: allure-results
          retention-days: 14

      - name: Upload Allure HTML Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report
          path: allure-report
          retention-days: 14

      - name: Upload Playwright Test Results & Traces Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-test-results
          path: test-results
          retention-days: 14

      - name: Deploy Allure Report to GitHub Pages
        if: always() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
